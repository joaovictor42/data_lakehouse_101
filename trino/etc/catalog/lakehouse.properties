# Catálogo "lakehouse": as camadas bronze/silver/gold guardadas como
# arquivos Parquet no MinIO, catalogadas pelo Hive Metastore.
#
# IMPORTANTE: as credenciais abaixo precisam ser IGUAIS às do MinIO
# definidas no .env (MINIO_ROOT_USER / MINIO_ROOT_PASSWORD). O Trino
# não lê o .env diretamente, por isso os valores estão fixos aqui.
#
# NOTA: a partir de certa versão do Trino, o acesso a S3 passou a usar
# o filesystem nativo (prefixo "s3.*" + fs.native-s3.enabled), no lugar
# das antigas propriedades "hive.s3.*". Se você usar uma versão de
# Trino mais antiga (< ~430), troque para as chaves hive.s3.* antigas.
connector.name=hive
hive.metastore.uri=thrift://hive-metastore:9083

fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.aws-access-key=trilha
s3.aws-secret-key=trilha123
s3.path-style-access=true

hive.non-managed-table-writes-enabled=true
