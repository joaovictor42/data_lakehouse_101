// Conexão pré-configurada que o CloudBeaver (dbeaver-web) carrega na
// primeira subida. Fica visível pra qualquer usuário anônimo (ver
// CLOUDBEAVER_APP_GRANT_CONNECTIONS_ACCESS_TO_ANONYMOUS_TEAM no
// docker-compose.yml) e o aluno não consegue editar nem apagar — só
// o administrador (credenciais em DBEAVER_ADMIN_USER/PASSWORD no .env).
//
// IMPORTANTE: este arquivo é só copiado para dentro do volume
// dbeaver-workspace na primeira subida (workspace vazio). Depois disso
// o CloudBeaver passa a gerenciar sua própria cópia — editar aqui não
// muda mais nada até resetar o volume (ver README).
//
// IMPORTANTE: host/porta/banco/usuário/senha abaixo precisam bater com
// POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB / POSTGRES_SCHEMA no
// .env — este arquivo não lê o .env (mesma limitação e mesmo padrão já
// usado em trino/etc/catalog/postgres.properties).
//
// "?currentSchema=schema" na URL JDBC é o que faz o aluno abrir a
// conexão e cair direto no schema "schema" — sem isso ele precisaria
// navegar até lá manualmente, passando por "public" e pelos schemas de
// sistema do Postgres (pg_catalog etc.), que não têm nenhum valor
// didático aqui. ("schema" é palavra reservada em vários bancos, mas
// não no Postgres nem no Trino — testado sem aspas em ambos.)
//
// As chaves "navigator-*" e "filters" abaixo, na conexão "postgres",
// reduzem a árvore de navegação ao mínimo possível: sem elas o aluno
// veria pastas "Databases / Administer / System Info" no topo, depois
// "Schemas / Event Triggers / Extensions / Storage / Roles" dentro do
// banco, e os schemas "schema" E "public" lado a lado (público vazio,
// mas ainda visível). Com elas, abrir a conexão "postgres" mostra só
// database -> "schema" -> as 4 tabelas, direto. Descobertas testando ao
// vivo via API do CloudBeaver (não é algo documentado oficialmente):
//   - "navigator-hide-folders": pula as pastas de agrupamento (Databases,
//     Schemas, Tables etc.) e mostra os objetos filhos direto.
//   - "navigator-show-only-entities" + "navigator-hide-virtual": tiram
//     Roles/Extensions/Event Triggers/Storage/System Info da árvore.
//   - "filters" com "exclude": ["public"]: some com o schema public
//     (o "id" do filtro, "database:database", é o nome do catálogo/
//     banco duas vezes — é como o CloudBeaver identifica esse nó
//     internamente; muda se POSTGRES_DB deixar de ser "database").
// Se um dia quiser voltar a ver a árvore completa (outros schemas,
// roles etc.), é só apagar essas quatro chaves da conexão "postgres".
//
// A segunda conexão ("trino") usa o driver Trino que já vem embutido
// no CloudBeaver Community (id "generic:trino_jdbc" — sem precisar
// baixar driver nenhum). O Trino deste projeto não tem autenticação
// configurada (ver trino/etc/config.properties), então só o "userName"
// já basta pra identificar a sessão. IMPORTANTE: não adicione
// "userPassword" aqui, nem vazio — o driver JDBC do Trino recusa
// autenticar com usuário+senha fora de uma conexão HTTPS (erro "TLS/SSL
// is required for authentication with username and password"), mesmo
// com senha em branco; a chave só pode existir se de fato houver senha
// e a URL for `https://`. A URL já aponta pro catálogo "lakehouse"
// (bronze/silver/gold) como padrão, mas o catálogo "postgres" (a fonte,
// ao vivo) continua acessível na mesma conexão — é só usar o nome
// completo, ex: `SELECT * FROM postgres.schema.customers`. Essa conexão
// não tem a mesma restrição de navegador da "postgres" porque o pedido
// original era só reduzir a visão do Postgres.
//
// "save-password": true aqui é o que evita a tela de login ao abrir
// essa conexão no navegador — mesmo sem senha real, o CloudBeaver só
// trata as credenciais como "prontas pra usar" (sem perguntar nada ao
// aluno) quando save-password é true; com false, ele marca a conexão
// como authNeeded=true e credentialsSaved=false, e a UI pede login na
// hora de conectar (erro típico: "Authentication failed: Basic
// authentication or X-Trino-Original-User or X-Trino-User must be
// sent", porque o diálogo de login não preenche o "userName" sozinho).
// Testado ao vivo via API do CloudBeaver: com save-password true,
// authNeeded vira false e credentialsSaved vira true, igual à conexão
// "postgres" — sem prompt nenhum, aluno só clica e usa.
{
  "folders": {},
  "connections": {
    "postgres-loja": {
      "provider": "postgresql",
      "driver": "postgres-jdbc",
      "name": "postgres",
      "save-password": true,
      "navigator-show-only-entities": true,
      "navigator-hide-folders": true,
      "navigator-hide-virtual": true,
      "configuration": {
        "host": "postgres",
        "port": "5432",
        "database": "database",
        "url": "jdbc:postgresql://postgres:5432/database?currentSchema=schema",
        "configurationType": "MANUAL",
        "auth-model": "native",
        "auth-properties": {
          "userName": "trilha",
          "userPassword": "trilha123"
        }
      },
      "filters": [
        {
          "id": "database:database",
          "type": "org.jkiss.dbeaver.ext.postgresql.model.PostgreSchema",
          "enabled": true,
          "exclude": ["public"]
        }
      ]
    },
    "trino-lakehouse": {
      "provider": "generic",
      "driver": "trino_jdbc",
      "name": "trino",
      "save-password": true,
      "configuration": {
        "host": "trino",
        "port": "8080",
        "database": "lakehouse",
        "url": "jdbc:trino://trino:8080/lakehouse",
        "configurationType": "MANUAL",
        "auth-model": "native",
        "auth-properties": {
          "userName": "student"
        }
      }
    }
  }
}
